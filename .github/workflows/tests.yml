name: Tests
on: [push, pull_request]

jobs:
  unit-tests:
    name: Unit Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4']
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, sqlite3, pdo_sqlite
          coverage: pcov
          tools: composer
      - name: Running composer
        run: composer install --prefer-dist --no-interaction
      - name: Running unit tests
        run: vendor/bin/phpunit --testsuite unit --coverage-clover coverage.clover
      - name: Downloading Ocular Tool
        continue-on-error: true
        run: composer global require scrutinizer/ocular dev-master
      - name: Uploading Code Metrics
        continue-on-error: true
        run: php ~/.composer/vendor/bin/ocular code-coverage:upload --format=php-clover coverage.clover

  integration-tests:
    name: Integration Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4']
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, sqlite3, pdo_sqlite
          coverage: none
          tools: composer
      - name: Running composer
        run: composer install --prefer-dist --no-interaction
      - name: Running integration tests
        run: vendor/bin/phpunit --testsuite integration
