name: Tests
on: [push, pull_request]

jobs:
  unit-tests:
    name: Unit Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.3', '8.4']
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, sqlite3, pdo_sqlite
          coverage: pcov
          tools: composer
      - name: Running composer
        run: composer install --prefer-dist --no-interaction
      - name: Running unit tests
        run: vendor/bin/phpunit --testsuite unit --coverage-clover coverage.clover
      - name: Downloading Ocular Tool
        continue-on-error: true
        run: composer global require scrutinizer/ocular dev-master
      - name: Uploading Code Metrics
        continue-on-error: true
        run: php ~/.composer/vendor/bin/ocular code-coverage:upload --format=php-clover coverage.clover

  integration-sqlite:
    name: Integration Tests (SQLite, PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.3', '8.4']
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, sqlite3, pdo_sqlite
          coverage: none
          tools: composer
      - name: Running composer
        run: composer install --prefer-dist --no-interaction
      - name: Running integration tests
        run: vendor/bin/phpunit --configuration tests/config/sqlite.xml --testsuite integration

  integration-postgres:
    name: Integration Tests (PostgreSQL, PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        php-version: ['8.3', '8.4']
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pgsql, pdo_pgsql
          coverage: none
          tools: composer
      - name: Running composer
        run: composer install --prefer-dist --no-interaction
      - name: Running integration tests
        run: vendor/bin/phpunit --configuration tests/config/postgresql.xml --testsuite integration

  integration-mysql:
    name: Integration Tests (MySQL, PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        php-version: ['8.3', '8.4']
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, mysqli, pdo_mysql
          coverage: none
          tools: composer
      - name: Running composer
        run: composer install --prefer-dist --no-interaction
      - name: Running integration tests
        run: vendor/bin/phpunit --configuration tests/config/mysql.xml --testsuite integration
